name: Versioned AI release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: python -m ruff check . && python check_prompt_pin.py
  tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: python -m pytest -q
  eval:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: python eval_prompts.py
  mcp_health:
    runs-on: ubuntu-latest
    needs: eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: python scripts/check_mcp_health.py
  build:
    runs-on: ubuntu-latest
    needs: mcp_health
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - id: image
        run: |
          VERSION=$(python -c 'from check_prompt_pin import validate; print(validate()[1]["version"])')
          IMAGE="afyaplus:${VERSION}-${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          docker build -t "$IMAGE" .
          docker run --rm "$IMAGE" python check_prompt_pin.py
          docker save "$IMAGE" -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: release-image
          path: image.tar
          retention-days: 7
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: capstone-stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - uses: actions/download-artifact@v4
        with:
          name: release-image
      - name: Load verified image and record stub deployment
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          docker load -i image.tar
          docker run --rm "$IMAGE" python check_prompt_pin.py
          python scripts/deploy_stub.py --image "$IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-record
          path: artifacts/deployment.json
