trigger:
  branches:
    include: [main]
pr:
  branches:
    include: ['*']
pool:
  vmImage: ubuntu-latest
stages:
- stage: lint
  jobs:
  - job: gate
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
    - script: pip install -r requirements.lock
    - script: |
          python -m ruff check . && python check_prompt_pin.py
- stage: tests
  dependsOn: lint
  jobs:
  - job: gate
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
    - script: pip install -r requirements.lock
    - script: |
          python -m pytest -q
- stage: eval
  dependsOn: tests
  jobs:
  - job: gate
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
    - script: pip install -r requirements.lock
    - script: |
          python eval_prompts.py
- stage: mcp_health
  dependsOn: eval
  jobs:
  - job: gate
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
    - script: pip install -r requirements.lock
    - script: |
          python scripts/check_mcp_health.py
- stage: build
  dependsOn: mcp_health
  jobs:
  - job: gate
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
    - script: pip install -r requirements.lock
    - script: |
          VERSION=$(python -c 'from check_prompt_pin import validate; print(validate()[1]["version"])')
          IMAGE="afyaplus:${VERSION}-$(Build.SourceVersion)"
          docker build -t "$IMAGE" .
          docker run --rm "$IMAGE" python check_prompt_pin.py
          mkdir -p "$(Build.ArtifactStagingDirectory)/release"
          docker save "$IMAGE" -o "$(Build.ArtifactStagingDirectory)/release/image.tar"
          echo "$IMAGE" > "$(Build.ArtifactStagingDirectory)/release/image.txt"
    - publish: $(Build.ArtifactStagingDirectory)/release
      artifact: release
- stage: deploy
  dependsOn: build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - deployment: stub
    environment: capstone-stub
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - download: current
            artifact: release
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
          - script: |
              docker load -i "$(Pipeline.Workspace)/release/image.tar"
              IMAGE=$(cat "$(Pipeline.Workspace)/release/image.txt")
              docker run --rm "$IMAGE" python check_prompt_pin.py
              python scripts/deploy_stub.py --image "$IMAGE"
          - publish: artifacts/deployment.json
            artifact: deployment-record
